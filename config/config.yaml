# Non-secret settings only. Secrets (OPENROUTER_API_KEY, TICKERPULSE_DB_PASSWORD,
# HF_TOKEN, LANGSMITH_API_KEY, API_KEY) live in .env -- see .env.example.

llm:
  provider: "openrouter"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    model: "google/gemini-3.5-flash-lite"
    timeout_seconds: 60
    max_retries: 3
    retry_backoff_seconds: 1.0
    cache_enabled: true            # exact-match, temperature=0 only

embedding:
  model: "all-MiniLM-L6-v2"
  tokenizer: "sentence-transformers/all-MiniLM-L6-v2"   # HybridChunker counts tokens with this
  device: "cpu"                    # encoder + reranker device. Explicit on purpose: auto-selected Apple MPS crashed under threads
  dim: 384

database:
  host: "localhost"
  port: 5432
  name: "tickerpulse"
  user: "postgres"
  sslmode: "require"
  schema: "hf_discovery"
  pool_size: 5

retrieval:
  # eval-winner: exp-dc89090e60 (hybrid128|dense|rerank)
  mode: "dense"                    # dense | hybrid
  k: 10
  top_n: 3
  score_threshold: 0.30
  rerank: true                     # switch: cross-encoder rerank of the candidates
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  chunker: "hybrid128"          # hierarchical | fixed50 | recursive200 | hybrid128
  fixed_chunk_words: 50
  recursive_chunk_size: 200
  recursive_chunk_overlap: 20
  hybrid_max_tokens: 128
  rrf_k: 60

router:
  encoder: "all-MiniLM-L6-v2"      # Semantic Router encoder; swappable
  routes_file: "config/routes.yaml"
  threshold: 0.35                  # min cosine similarity to accept a route (else out_of_scope)
  combined_margin: 0.05            # a 2nd route within this margin makes the intent combined

observability:
  tracing_enabled: true            # traces are sent only when LANGSMITH_API_KEY is also set
  project: "hf-knowledge-agent"
  prompt_version: "v2"             # bump when a system prompt changes; it tags every trace
  max_chars: 2000                  # longest string kept in a trace field

guard:
  enabled: true                   # semantic input guard (PII masking is always on)
  routes_file: "config/guard_routes.yaml"
  threshold: 0.40                  # min similarity for a blocking route to count
  self_check: true                 # extra LLM policy check on every message (one cheap call)
  passage_check: true              # one LLM call per doc question: drop retrieved passages that carry instructions for the AI
  passage_chars: 1200              # characters of each passage shown to that check

agent:
  history_turns: 6                 # past turns shown to the LLM when memory is on
  max_tool_result_chars: 8000      # tool output is truncated to this before the LLM sees it
  max_tool_rounds: 3               # LLM <-> MCP tool-calling rounds per question
  mcp_module: "tools.mcp_server"   # launched as a local stdio MCP server
  allowed_tools:                   # anything else the MCP server offers is dropped
    - search_models
    - search_embedding_models
    - get_model_details
    - search_datasets
    - get_dataset_details
    - get_card_section
    - compare_resources
    - search_docs
    - benchmark_embedding_model    # restricted: only usable through the human-approval flow

huggingface:
  base_url: "https://huggingface.co"
  api_timeout_seconds: 30
  max_retries: 3
  cache_ttl_seconds: 900           # 15 min (spec range 15-60 min)
  max_results: 50
  max_card_chars: 6000             # model-card text returned to the agent is truncated to this

benchmarks:
  max_runtime_seconds: 600
  max_memory_mb: 4096              # enforced via RLIMIT_AS on Linux; checked after the run elsewhere
  dataset_dir: "data/benchmarks"   # <dataset_id>.json files (written by the dataset fetch script)
  ks: [1, 5, 10]
  default_seed: 0
  poll_interval_seconds: 2.0       # how often the agent checks job status while waiting
  max_models_per_benchmark: 3
  max_corpus_docs: 5000
  max_queries: 1000
  allowed_models:                  # only these may be benchmarked (no arbitrary repos)
    - sentence-transformers/all-MiniLM-L6-v2
    - BAAI/bge-small-en-v1.5
    - intfloat/multilingual-e5-small
    - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  prefixes:                        # per-model text prefixes the model was trained with
    intfloat/multilingual-e5-small: {query: "query: ", passage: "passage: "}

api:
  auth_enabled: false              # true on Railway; key comes from env API_KEY
  cors_origins: ["http://localhost:5173"]
  host: "127.0.0.1"
  port: 8000
  max_message_chars: 2000

ingest:
  sources_file: "config/sources.yaml"
  github_api: "https://api.github.com"
  raw_base: "https://raw.githubusercontent.com"
  fetch_timeout_seconds: 30
  fetch_max_retries: 3
  embed_batch_size: 64
  allowed_licenses: [Apache-2.0, MIT, BSD-3-Clause, CC-BY-4.0]   # repo licenses cleared for indexing
  min_page_bytes: 1500
  max_page_bytes: 120000
  max_duplicate_ratio: 0.2         # validation: share of chunks with a repeated content hash
  max_broken_url_ratio: 0.02       # validation: share of citation URLs that must resolve
  url_check_workers: 2             # low on purpose: huggingface.co rate-limits (429) bursts
  url_check_delay_seconds: 0.5     # pause before each check
  url_check_backoff_seconds: 2.0   # base for exponential backoff on 429/5xx
  url_check_timeout_seconds: 15
  smoke_queries:                   # validation: each must retrieve a chunk whose URL contains `expect`
    - {query: "How do I limit the length of generated text?", expect: "/docs/transformers/"}
    - {query: "How do I load a dataset with the datasets library?", expect: "/docs/datasets/"}
    - {query: "How do I upload a file to the Hub with huggingface_hub?", expect: "/docs/huggingface_hub/"}
    - {query: "How do I train a Sentence Transformer model?", expect: "sbert.net"}
    - {query: "How do I create a model card on the Hub?", expect: "/docs/hub/"}

evals:
  golden_file: "observability/golden/golden.json"
  dataset_name: "hf-knowledge-agent-golden-v1"   # LangSmith dataset
  results_file: "observability/reports/variants.json"
  report_file: "observability/reports/leaderboard.md"
  recall_k: 5                      # candidates scored for Recall@k / MRR (the LLM sees retrieval.top_n of them)
  workers: 4                       # parallel LLM calls while evaluating
  bootstrap_samples: 1000
