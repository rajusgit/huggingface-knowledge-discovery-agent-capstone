# Non-secret settings only. Secrets (OPENROUTER_API_KEY, TICKERPULSE_DB_PASSWORD,
# HF_TOKEN, LANGSMITH_API_KEY, API_KEY) live in .env -- see .env.example.

llm:
  provider: "openrouter"
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    model: "google/gemini-3.5-flash-lite"
    timeout_seconds: 60
    max_retries: 3
    retry_backoff_seconds: 1.0
    cache_enabled: true            # exact-match, temperature=0 only

embedding:
  model: "all-MiniLM-L6-v2"
  dim: 384

database:
  host: "localhost"
  port: 5432
  name: "tickerpulse"
  user: "postgres"
  sslmode: "require"
  schema: "hf_discovery"
  pool_size: 5

retrieval:
  mode: "dense"                    # dense | hybrid
  k: 10
  top_n: 3
  score_threshold: 0.30
  reranker: "cross-encoder/ms-marco-MiniLM-L-6-v2"   # null disables reranking
  chunker: "hierarchical"          # hierarchical | fixed50 | recursive200 | hybrid128
  fixed_chunk_words: 50
  recursive_chunk_size: 200
  recursive_chunk_overlap: 20
  hybrid_max_tokens: 128
  rrf_k: 60

router:
  encoder: "all-MiniLM-L6-v2"      # Semantic Router encoder; swappable
  routes_file: "config/routes.yaml"
  threshold: 0.35                  # min cosine similarity to accept a route (else out_of_scope)
  combined_margin: 0.05            # a 2nd route within this margin makes the intent combined

agent:
  history_turns: 6                 # past turns shown to the LLM when memory is on
  max_tool_result_chars: 8000      # tool output is truncated to this before the LLM sees it
  max_tool_rounds: 3               # LLM <-> MCP tool-calling rounds per question
  mcp_module: "tools.mcp_server"   # launched as a local stdio MCP server

huggingface:
  base_url: "https://huggingface.co"
  api_timeout_seconds: 30
  max_retries: 3
  cache_ttl_seconds: 900           # 15 min (spec range 15-60 min)
  max_results: 50
  max_card_chars: 6000             # model-card text returned to the agent is truncated to this

benchmarks:
  max_runtime_seconds: 600
  max_memory_mb: 4096

api:
  auth_enabled: false              # true on Railway; key comes from env API_KEY
  cors_origins: ["http://localhost:5173"]
  host: "127.0.0.1"
  port: 8000
  max_message_chars: 2000

ingest:
  sources_file: "config/sources.yaml"
  github_api: "https://api.github.com"
  raw_base: "https://raw.githubusercontent.com"
  fetch_timeout_seconds: 30
  fetch_max_retries: 3
  embed_batch_size: 64
