name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: "1"                              # tests skip anything that needs the RDS database
  TICKERPULSE_DB_PASSWORD: "ci-placeholder"
  OPENROUTER_API_KEY: "ci-placeholder"  # unit tests mock every LLM call

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (includes the src/llm.py isolation + single-gateway checks, tool contracts, retrieval smoke, injection tests)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
