[project]
name = "hf-knowledge-discovery-agent"
version = "0.1.0"
description = "Hugging Face Knowledge & Discovery Agent (capstone)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
