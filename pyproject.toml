[project]
name = "hf-knowledge-discovery-agent"
version = "0.1.0"
description = "Hugging Face Knowledge & Discovery Agent (capstone)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "openai>=3.35.1",
    "docling>=2.141.0",
    "sentence-transformers>=6.1.0",
    "fastapi>=0.156.4",
    "uvicorn>=0.54.0",
    "mcp<2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-mcp-adapters>=0.3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
